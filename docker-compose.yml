services:
  go2-rl:
    build:
      context: .
      dockerfile: Dockerfile
    image: unitree-go2-rl:latest
    container_name: go2-rl-runner
    ipc: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    command: python train_all.py
